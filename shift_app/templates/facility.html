<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>{{ f.name }} - シフト</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  body { font-family: "Hiragino Sans", "Noto Sans JP", sans-serif; margin: 1rem; color: #223; }
  h1 { font-size: 1.2rem; margin: .2rem 0 .8rem; }
  a { color: #467; }
  .tabs { display: flex; gap: .4rem; margin-bottom: 1rem; }
  .tabs button { padding: .45rem 1.1rem; border: 1px solid #99b; border-radius: 8px 8px 0 0; background: #eef; cursor: pointer; font-size: .95rem; }
  .tabs button.active { background: #467; color: #fff; border-color: #467; }
  .panel { display: none; }
  .panel.active { display: block; }
  table { border-collapse: collapse; font-size: .8rem; }
  th, td { border: 1px solid #ccd; padding: .15rem .3rem; text-align: center; white-space: nowrap; }
  th { background: #eef2f8; position: sticky; top: 0; }
  .gridwrap { overflow: auto; max-height: 75vh; border: 1px solid #99b; }
  td.name, th.name { text-align: left; position: sticky; left: 0; background: #f7f9fc; min-width: 8.5rem; z-index: 2;}
  input.cell { width: 4.2rem; border: none; text-align: center; font-size: .8rem; background: transparent; }
  input.cell:focus { outline: 2px solid #467; background: #fff; }
  tr.summary td { background: #f2f4ee; font-weight: 600; }
  td.sat { background: #eef4ff; } td.sun { background: #ffefef; }
  .status { margin: .5rem 0; color: #275; min-height: 1.2em; }
  .kpis { display: flex; flex-wrap: wrap; gap: .7rem; margin-bottom: 1rem; }
  .kpi { border: 1px solid #ccd; border-radius: 8px; padding: .5rem .9rem; background: #f7f9fc; min-width: 10rem; }
  .kpi .label { font-size: .75rem; color: #556; }
  .kpi .value { font-size: 1.25rem; font-weight: 700; }
  .ok { color: #1a7d3c; } .ng { color: #b3261e; }
  .haichi td:first-child { text-align: left; background: #f7f9fc; }
  h2 { font-size: 1.05rem; margin: 1.2rem 0 .4rem; }
</style>
</head>
<body>
<a href="/">&larr; 施設一覧</a>
<h1>{{ f.name }} <span id="ym"></span></h1>
<div class="tabs">
  <button data-tab="grid" class="active">シフト入力</button>
  <button data-tab="dash">管理ダッシュボード</button>
  <button data-tab="masters">マスタ</button>
</div>

<div id="panel-grid" class="panel active">
  <div class="status" id="grid-status"></div>
  <div class="gridwrap"><table id="grid"></table></div>
  <datalist id="codes"></datalist>
</div>

<div id="panel-dash" class="panel">
  <div class="status" id="dash-status"></div>
  <h2>人員配置判定</h2>
  <table class="haichi" id="haichi"></table>
  <h2>月間指標</h2>
  <div class="kpis" id="kpis"></div>
  <h2>職員別 勤務集計</h2>
  <div class="gridwrap"><table id="staff"></table></div>
</div>

<div id="panel-masters" class="panel">
  <div class="status"></div>
  <h2>シフト略記号</h2>
  <div class="gridwrap" style="max-height:40vh"><table id="mcodes"></table></div>
  <h2>職員</h2>
  <div class="gridwrap" style="max-height:40vh"><table id="mstaff"></table></div>
</div>

<script>
const FID = {{ f.id }};
const $ = s => document.querySelector(s);

document.querySelectorAll('.tabs button').forEach(b => b.onclick = () => {
  document.querySelectorAll('.tabs button').forEach(x => x.classList.remove('active'));
  document.querySelectorAll('.panel').forEach(x => x.classList.remove('active'));
  b.classList.add('active');
  $('#panel-' + b.dataset.tab).classList.add('active');
  if (b.dataset.tab === 'dash') loadDash();
  if (b.dataset.tab === 'masters') loadMasters();
});

function esc(s) { return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;'); }

async function loadGrid() {
  $('#grid-status').textContent = '読み込み中…(初回はブックの解析に1〜2分かかります)';
  const g = await (await fetch(`/api/f/${FID}/grid`)).json();
  $('#ym').textContent = `${g.year}年${g.month}月`;
  $('#codes').innerHTML = g.codes.map(c => `<option value="${esc(c)}">`).join('');
  let h = '<tr><th class="name">職員</th>' + g.days.map(d =>
      `<th class="${d.weekday==='土'?'sat':d.weekday==='日'?'sun':''}">${d.day}<br>${d.weekday}</th>`).join('') + '</tr>';
  for (const r of g.rows) {
    h += `<tr><td class="name" title="${esc(r.role)}">${esc(r.name) || '<span style=color:#aab>' + esc(r.role) + '</span>'}</td>`;
    r.cells.forEach((c, i) => {
      const wd = g.days[i].weekday;
      h += `<td class="${wd==='土'?'sat':wd==='日'?'sun':''}">` +
           `<input class="cell" list="codes" data-row="${r.row}" data-day="${i+1}" value="${esc(c)}"></td>`;
    });
    h += '</tr>';
  }
  for (const s of g.summary) {
    h += `<tr class="summary"><td class="name">${esc(s.label)}</td>` +
         s.cells.map(v => `<td>${esc(v)}</td>`).join('') + '</tr>';
  }
  $('#grid').innerHTML = h;
  $('#grid-status').textContent = '';
  document.querySelectorAll('input.cell').forEach(inp => {
    inp.dataset.orig = inp.value;
    inp.onchange = () => saveCell(inp);
  });
}

async function saveCell(inp) {
  if (inp.value === inp.dataset.orig) return;
  $('#grid-status').textContent = '保存中…';
  await fetch(`/api/f/${FID}/grid`, {
    method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({edits: [{row: +inp.dataset.row, day: +inp.dataset.day, value: inp.value}]})
  });
  inp.dataset.orig = inp.value;
  $('#grid-status').textContent = '保存しました(集計は再計算されます)';
  loadGridSummaryOnly();
}

async function loadGridSummaryOnly() {
  const g = await (await fetch(`/api/f/${FID}/grid`)).json();
  const rows = document.querySelectorAll('#grid tr.summary');
  g.summary.forEach((s, i) => {
    const tds = rows[i]?.querySelectorAll('td');
    if (!tds) return;
    s.cells.forEach((v, j) => { if (tds[j+1]) tds[j+1].textContent = v; });
  });
}

async function loadDash() {
  $('#dash-status').textContent = '再計算中…';
  const d = await (await fetch(`/api/f/${FID}/dashboard`)).json();
  $('#haichi').innerHTML = Object.entries(d.haichi).map(([k, v]) => {
    const cls = String(v).includes('未達') ? 'ng' : String(v).includes('到達') ? 'ok' : '';
    return `<tr><td>${esc(k)}</td><td class="${cls}">${esc(v)}</td></tr>`;
  }).join('');
  $('#kpis').innerHTML = Object.entries(d.kpi).map(([k, v]) =>
    `<div class="kpi"><div class="label">${esc(k)}</div><div class="value">${esc(v)}</div></div>`).join('');
  let h = '<tr><th>職種</th><th>氏名</th><th>資格</th><th>雇用</th><th>総労働h</th><th>日中h</th><th>人工</th><th>休日数</th><th>法定休日</th></tr>';
  for (const s of d.staff) {
    const cls = String(s.legal_holiday).includes('OK') ? 'ok' : String(s.legal_holiday).includes('割増') ? 'ng' : '';
    h += `<tr><td>${esc(s.role)}</td><td class="name">${esc(s.name)}</td><td>${esc(s.qual)}</td><td>${esc(s.pay)}</td>` +
         `<td>${esc(s.total_hours)}</td><td>${esc(s.day_hours)}</td><td>${esc(s.fte)}</td>` +
         `<td>${esc(s.holidays)}</td><td class="${cls}">${esc(s.legal_holiday)}</td></tr>`;
  }
  $('#staff').innerHTML = h;
  $('#dash-status').textContent = '';
}

async function loadMasters() {
  const m = await (await fetch(`/api/f/${FID}/masters`)).json();
  $('#mcodes').innerHTML = '<tr><th>記号</th><th>開始</th><th>終了</th><th>休憩</th><th>日中h</th><th>全体h</th></tr>' +
    m.shift_codes.map(c => `<tr><td>${esc(c.code)}</td><td>${esc(c.start)}</td><td>${esc(c.end)}</td>` +
      `<td>${esc(c.break_start ? c.break_start + '〜' + c.break_end : '')}</td>` +
      `<td>${esc(c.daytime_hours)}</td><td>${esc(c.total_hours)}</td></tr>`).join('');
  $('#mstaff').innerHTML = '<tr><th>区分</th><th>氏名</th><th>職種</th><th>番号</th><th>資格</th><th>雇用</th></tr>' +
    m.staff.map(s => `<tr><td>${esc(s.category)}</td><td>${esc(s.name)}</td><td>${esc(s.role)}</td>` +
      `<td>${esc(s.employee_no)}</td><td>${esc(s.qualification)}</td><td>${esc(s.pay_type)}</td></tr>`).join('');
}

loadGrid();
</script>
</body>
</html>
