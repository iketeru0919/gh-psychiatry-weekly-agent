<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>ログイン - シフト管理</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  body { font-family: "Hiragino Sans", "Noto Sans JP", sans-serif; display: flex; justify-content: center; align-items: center; min-height: 90vh; color: #223; }
  .box { border: 1px solid #ccd; border-radius: 10px; padding: 2rem 2.5rem; background: #f7f9fc; text-align: center; }
  input[type=password] { padding: .45rem; font-size: 1rem; border: 1px solid #99b; border-radius: 6px; }
  button { margin-left: .5rem; padding: .45rem 1.2rem; border-radius: 6px; border: 1px solid #467; background: #467; color: #fff; cursor: pointer; font-size: 1rem; }
  .err { color: #b3261e; margin-top: .6rem; }
  .note { color: #667; font-size: .85rem; margin-top: 1rem; }
</style>
</head>
<body>
<div class="box">
  <h1 style="font-size:1.2rem">障害者GH シフト管理</h1>
  <form method="post">
    <input type="password" name="password" placeholder="パスワード" autofocus required>
    <button type="submit">ログイン</button>
  </form>
  {% if error %}<div class="err">{{ error }}</div>{% endif %}
  <p class="note">管理者用・現場用のパスワードはシステム管理者にご確認ください。</p>
</div>
</body>
</html>
